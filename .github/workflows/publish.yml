name: Publish Packages to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (default: latest)"
        required: false
        default: "latest"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"
      - "packages/**"
      - "index.json"

jobs:
  validate:
    name: Validate Marketplace Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0

      - name: Validate index.json
        run: node scripts/validate-index.js

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Publish approved marketplace packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag="${{ github.event.inputs.dist_tag || 'latest' }}"
          echo "Publishing packages to npm with tag: $tag"
          for package in \
            @everywhere-harness/preset-protheus \
            @everywhere-harness/plugin-providers \
            @everywhere-harness/client-ui-chat
          do
            version=$(node -p "require('./packages/${package##*/}/package.json').version")
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "Skipping $package@$version: already published"
              continue
            fi

            pnpm --filter "$package" publish --access public --tag "$tag" --no-git-checks
          done
